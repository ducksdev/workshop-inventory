# Option A (prebuilt image from GitHub Container Registry):
#   docker compose up -d
# Option B (build locally from a release folder): replace `image:` with `build: .`
services:
  inventory:
    image: ghcr.io/ducksdev/workshop-inventory:latest
    container_name: workshop-inventory
    ports:
      - "3100:3100"
    volumes:
      - ./data:/data
    restart: unless-stopped
