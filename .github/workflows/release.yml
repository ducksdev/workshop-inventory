# Builds a release whenever you push a version tag:
#   npm version minor        # bumps package.json + creates tag vX.Y.0
#   git push --follow-tags
# Produces: GitHub Release with workshop-inventory.tar.gz (what install.sh downloads),
#           a versioned .tar.gz/.zip, and a Docker image at ghcr.io/<owner>/workshop-inventory.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Check tag matches package.json
        run: |
          PKG=v$(node -p "require('./package.json').version")
          [ "$PKG" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != package.json $PKG. Use 'npm version' to bump."; exit 1; }
      - name: Check public key is committed
        run: test -f keys/public.pem || { echo "keys/public.pem missing — run 'npm run keygen -- init' locally and commit keys/public.pem"; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: node scripts/package.mjs
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/workshop-inventory.tar.gz
            release/workshop-inventory-*.tar.gz
            release/workshop-inventory-*.zip
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.ref_name }}
