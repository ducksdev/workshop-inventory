# Publishes a release whenever the version in package.json changes on main.
#
#   npm version patch   # or minor / major — bumps package.json (and makes a local tag)
#   git push            # push main; this workflow creates tag vX.Y.Z + the release
#
# Also runs for a manually pushed vX.Y.Z tag, or via "Run workflow" in the Actions tab.
#
# Produces: GitHub Release with workshop-inventory.tar.gz (what install.sh downloads),
#           a versioned .tar.gz/.zip, and a Docker image at ghcr.io/<owner>/workshop-inventory.
name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v$(node -p "require('./package.json').version")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($TAG). Use 'npm version' to bump."; exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to publish."; echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will publish $TAG"; echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Check public key is committed
        run: test -f keys/public.pem || { echo "keys/public.pem missing — run 'npm run keygen -- init' locally and commit keys/public.pem"; exit 1; }
      - run: npm ci
      - run: npm run build
      - run: node scripts/package.mjs
      - name: Release notes from CHANGELOG.md
        id: notes
        run: |
          V="${{ needs.check.outputs.tag }}"; V="${V#v}"
          # take the "## <version>" section from CHANGELOG.md, if present
          awk -v v="$V" '/^## /{p=($2==v)} p && !/^## /{print}' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ -s notes.md ]; then echo "found=true" >> "$GITHUB_OUTPUT"; echo "Using CHANGELOG section for $V"; cat notes.md; else echo "found=false" >> "$GITHUB_OUTPUT"; echo "No CHANGELOG section for $V; using auto-generated notes"; fi
      - name: Publish GitHub Release (creates the tag if needed)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Workshop Inventory ${{ needs.check.outputs.tag }}
          body_path: ${{ steps.notes.outputs.found == 'true' && 'notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          files: |
            release/workshop-inventory.tar.gz
            release/workshop-inventory-*.tar.gz
            release/workshop-inventory-*.zip
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build & push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ needs.check.outputs.tag }}
