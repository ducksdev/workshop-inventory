name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node --check public/app.js
      - name: Smoke test
        run: |
          mkdir -p keys && [ -f keys/public.pem ] || node dist/keygen.js init
          PORT=3999 node dist/index.js & sleep 2
          curl -fsS localhost:3999/api/meta | head -c 200
          curl -fsS -X POST localhost:3999/api/items -H 'content-type: application/json' \
            -d '{"category":"hardware","attributes":{"thread":"M3","length":"12","kind":"Socket Head Cap Screw"},"quantity":5,"min_quantity":2}' | grep -q '"M3 x 12mm Socket Head Cap Screw"'
